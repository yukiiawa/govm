name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

jobs:
  release:
    name: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        shell: pwsh
        run: .github/scripts/setup-zig.ps1

      - name: Show toolchain
        shell: pwsh
        run: zig version

      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag_name="${INPUT_TAG}"
          else
            tag_name="${REF_TAG}"
          fi

          if [[ ! "${tag_name}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$$ ]]; then
            echo "invalid release tag: ${tag_name}" >&2
            exit 1
          fi

          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag_name#v}" >> "${GITHUB_OUTPUT}"

      - name: Run unit tests
        run: zig build test --summary all

      - name: Build release targets
        run: zig build release --summary all

      - name: Package release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          release_root="zig-out/bin/release"
          dist_dir="${GITHUB_WORKSPACE}/dist"
          mkdir -p "${dist_dir}"

          if [[ ! -d "${release_root}" ]]; then
            echo "release output directory not found: ${release_root}" >&2
            exit 1
          fi

          shopt -s nullglob
          target_dirs=("${release_root}"/*)
          if (( ${#target_dirs[@]} == 0 )); then
            echo "no release targets found in ${release_root}" >&2
            exit 1
          fi

          for target_dir in "${target_dirs[@]}"; do
            [[ -d "${target_dir}" ]] || continue
            target="$(basename "${target_dir}")"
            archive_base="govm-${VERSION}-${target}"

            if [[ "${target}" == windows-* ]]; then
              (
                cd "${target_dir}"
                zip -9 -r "${dist_dir}/${archive_base}.zip" .
              )
            else
              tar -C "${target_dir}" -czf "${dist_dir}/${archive_base}.tar.gz" .
            fi
          done

          (
            cd "${dist_dir}"
            sha256sum -- * > SHA256SUMS.txt
          )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          generate_release_notes: true
          files: dist/*
