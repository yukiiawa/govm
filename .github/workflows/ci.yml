name: CI

on:
  push:
    branches:
      - main
      - master
      - "test/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache

jobs:
  unit-tests:
    name: unit-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x64
            os: ubuntu-latest
          - name: ubuntu-arm64
            os: ubuntu-24.04-arm
          - name: windows-x64
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
          - name: macos-arm64
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        shell: pwsh
        run: .github/scripts/setup-zig.ps1

      - name: Show toolchain
        shell: pwsh
        run: |
          zig version
          zig env
          Write-Host "Runner architecture: $env:RUNNER_ARCH"

      - name: Run unit tests
        run: zig build --verbose --summary all test

  cross-build:
    name: cross-build-release-targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        shell: pwsh
        run: .github/scripts/setup-zig.ps1

      - name: Show toolchain
        shell: pwsh
        run: zig version

      - name: Build all release targets
        run: zig build release --summary all

  e2e:
    name: e2e-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-bash
            os: ubuntu-latest
          - name: ubuntu-fish
            os: ubuntu-latest
            install_fish: true
          - name: ubuntu-bash-arm64
            os: ubuntu-24.04-arm
          - name: windows-pwsh
            os: windows-latest
          - name: windows-pwsh-arm64
            os: windows-11-arm
          - name: macos-zsh
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        shell: pwsh
        run: .github/scripts/setup-zig.ps1

      - name: Show toolchain
        shell: pwsh
        run: |
          zig version
          zig env
          Write-Host "Runner architecture: $env:RUNNER_ARCH"

      - name: Build govm
        run: zig build --verbose --summary all

      - name: Install fish
        if: matrix.install_fish == true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fish

      - name: Run e2e on Ubuntu with Bash
        if: matrix.name == 'ubuntu-bash' || matrix.name == 'ubuntu-bash-arm64'
        shell: bash
        run: bash .github/scripts/e2e.sh

      - name: Run e2e on Ubuntu with Fish
        if: matrix.name == 'ubuntu-fish'
        shell: bash
        run: fish .github/scripts/e2e.fish

      - name: Run e2e on Windows with PowerShell
        if: matrix.name == 'windows-pwsh' || matrix.name == 'windows-pwsh-arm64'
        shell: pwsh
        run: .github/scripts/e2e.ps1

      - name: Run e2e on macOS with Zsh
        if: matrix.name == 'macos-zsh'
        shell: bash
        run: zsh .github/scripts/e2e.sh
